<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fulmine — Fisica dei Fulmini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0a0a0f;--surface:#0f0f18;--surface2:#14141f;
      --gold:#c9a84c;--blue:#4a9eff;--white:#e8e6e0;
      --muted:#666680;--border:rgba(201,168,76,.15);
      --red:#ff4444;--green:#44cc88;--plasma:#7b2fff;
      --mono:'JetBrains Mono','Courier New',monospace;
    }
    html{scroll-snap-type:y mandatory;overflow-y:scroll;overflow-x:hidden;}
    body{overflow:visible;background:var(--bg);color:var(--white);
      font-family:'Cormorant Garamond',Georgia,serif;
      font-size:clamp(1rem,1.4vw,1.2rem);line-height:1.75;}
    h1{font-weight:300;font-size:clamp(5rem,12vw,11rem);line-height:.9;letter-spacing:-.02em;}
    h2{font-weight:300;font-size:clamp(2.5rem,5vw,4.5rem);line-height:1.05;letter-spacing:-.01em;}
    h3{font-weight:400;font-size:clamp(1.4rem,2.5vw,2rem);line-height:1.2;margin-bottom:1rem;}
    p{margin-bottom:1rem;opacity:.85;}p:last-child{margin-bottom:0;}
    strong{color:var(--gold);font-weight:600;}em{color:var(--blue);font-style:italic;}
    .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;
      color:var(--gold);margin-bottom:1rem;display:block;}
    .label{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--muted);}

    /* SECTIONS */
    .section{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      overflow:hidden;position:relative;background:var(--bg);}

    /* HORIZONTAL CAROUSEL */
    .hc-wrap{position:relative;width:100%;height:100%;overflow:hidden;}
    .hc-track{display:flex;height:100%;will-change:transform;
      transition:transform .5s cubic-bezier(.25,.1,.25,1);}
    .hc-slide{min-width:100vw;width:100vw;height:100%;overflow:hidden;
      display:flex;align-items:stretch;position:relative;}

    /* SLIDE LAYOUTS */
    .slide-split{display:flex;width:100%;height:100%;}
    .slide-left{flex:0 0 50%;max-width:50%;padding:4rem 2rem 4rem 5.5rem;
      display:flex;flex-direction:column;justify-content:center;z-index:1;}
    .slide-right{flex:0 0 50%;max-width:50%;display:flex;align-items:center;
      justify-content:center;overflow:hidden;position:relative;}
    .slide-center{display:flex;flex-direction:column;align-items:center;
      justify-content:center;width:100%;padding:3rem 5.5rem;text-align:center;}
    .slide-full{width:100%;height:100%;position:relative;}

    /* CAROUSEL NAV */
    .hc-arrows{position:absolute;bottom:2rem;right:2rem;display:flex;gap:.5rem;z-index:100;}
    .hc-arrow{font-family:var(--mono);background:rgba(201,168,76,.08);
      border:1px solid var(--border);color:var(--gold);width:2.5rem;height:2.5rem;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      font-size:1rem;transition:background .2s,border-color .2s;user-select:none;}
    .hc-arrow:hover{background:rgba(201,168,76,.2);border-color:var(--gold);}
    .hc-arrow:disabled{opacity:.3;cursor:default;}
    .hc-dots{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);
      display:flex;gap:.5rem;z-index:100;}
    .hc-dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--muted);
      transition:background .3s,transform .3s;cursor:pointer;}
    .hc-dot.active{background:var(--gold);transform:scale(1.4);}

    /* FIXED UI */
    #progress-bar{position:fixed;top:0;left:0;height:2px;background:var(--gold);
      transition:width .4s ease;z-index:1000;box-shadow:0 0 8px var(--gold);}
    #nav-dots{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);
      display:flex;flex-direction:column;gap:.6rem;z-index:1000;}
    .nav-dot{width:.35rem;height:.35rem;border-radius:50%;background:var(--muted);
      transition:background .3s,transform .3s;cursor:pointer;}
    .nav-dot.active{background:var(--gold);transform:scale(1.6);}
    #slide-counter{position:fixed;bottom:2rem;right:2rem;font-family:var(--mono);
      font-size:.65rem;color:var(--muted);letter-spacing:.1em;z-index:1000;}
    #fullscreen-btn{position:fixed;bottom:2rem;left:2rem;font-family:var(--mono);
      font-size:.75rem;color:var(--muted);background:none;border:1px solid var(--border);
      padding:.4rem .6rem;cursor:pointer;z-index:1000;transition:color .2s,border-color .2s;}
    #fullscreen-btn:hover{color:var(--gold);border-color:var(--gold);}
    #scroll-hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
      font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:.1em;
      z-index:1000;animation:bounce 2s ease infinite;transition:opacity .5s;}
    #scroll-hint.hidden{opacity:0;pointer-events:none;}
    @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0);}
      50%{transform:translateX(-50%) translateY(-6px);}}

    /* REVEAL */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
    .reveal.visible{opacity:1;transform:none;}
    .reveal-d1{transition-delay:.1s;}.reveal-d2{transition-delay:.2s;}
    .reveal-d3{transition-delay:.3s;}.reveal-d4{transition-delay:.4s;}

    /* PHASE CONTROLS */
    .phase-controls{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem;}
    .phase-btn{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
      padding:.4rem .8rem;border:1px solid var(--border);background:transparent;
      color:var(--muted);cursor:pointer;transition:all .2s;}
    .phase-btn:hover{border-color:var(--gold);color:var(--gold);}
    .phase-btn.active{border-color:var(--gold);color:var(--bg);background:var(--gold);}
    .play-btn{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
      padding:.4rem 1rem;border:1px solid var(--blue);background:transparent;
      color:var(--blue);cursor:pointer;transition:all .2s;}
    .play-btn:hover{background:rgba(74,158,255,.15);}
    .play-btn.playing{opacity:.5;cursor:not-allowed;}

    /* CARDS */
    .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:1.5rem;width:100%;padding:2rem 5.5rem;}
    .card{background:var(--surface);border:1px solid var(--border);padding:1.5rem;
      transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(201,168,76,.12);
      border-color:rgba(201,168,76,.4);}
    .card .card-icon{font-size:2rem;margin-bottom:.75rem;display:block;}
    .card h4{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:.5rem;}
    .card p{font-size:.9rem;}

    /* FLIP CARDS */
    .flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;
      width:100%;padding:1rem 5.5rem;max-width:1200px;margin:0 auto;}
    .myth-card{perspective:1000px;cursor:pointer;height:160px;}
    .myth-card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
      transition:transform .6s cubic-bezier(.4,0,.2,1);}
    .myth-card.flipped .myth-card-inner{transform:rotateY(180deg);}
    .myth-front,.myth-back{position:absolute;inset:0;backface-visibility:hidden;
      padding:1rem;display:flex;flex-direction:column;justify-content:center;}
    .myth-front{background:var(--surface);border:1px solid var(--border);}
    .myth-back{background:var(--surface2);border:1px solid rgba(68,204,136,.3);
      transform:rotateY(180deg);}
    .myth-front .myth-label{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;
      color:var(--red);text-transform:uppercase;margin-bottom:.5rem;}
    .myth-back .myth-label{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;
      color:var(--green);text-transform:uppercase;margin-bottom:.5rem;}
    .myth-card h4{font-size:.95rem;font-weight:400;color:var(--white);line-height:1.3;}
    .myth-card p{font-size:.8rem;line-height:1.4;margin:0;}

    /* DATA TABLE */
    .data-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.75rem;}
    .data-table th{text-align:left;padding:.6rem 1rem;border-bottom:1px solid var(--border);
      color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
    .data-table td{padding:.6rem 1rem;border-bottom:1px solid rgba(201,168,76,.06);
      color:var(--white);opacity:.85;}
    .data-table tr:hover td{background:rgba(201,168,76,.04);}

    /* NUMBERS STRIP */
    .numbers-strip{display:flex;flex-wrap:wrap;width:100%;}
    .stat-item{flex:1 1 200px;padding:2rem 1.5rem;border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);}
    .stat-item:last-child{border-right:none;}
    .stat-value{font-family:var(--mono);font-size:clamp(1.8rem,3vw,2.8rem);
      font-weight:700;color:var(--gold);display:block;line-height:1;margin-bottom:.4rem;}
    .stat-unit{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em;}
    .stat-desc{font-size:.85rem;color:var(--muted);margin-top:.25rem;}

    /* WARNING BOX */
    .warning-box{border-left:3px solid var(--red);background:rgba(255,68,68,.06);
      padding:1rem 1.5rem;margin-top:1.5rem;}
    .warning-box .warning-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--red);margin-bottom:.5rem;}
    .warning-box p{font-size:.9rem;margin:0;}

    /* THUNDER CALCULATOR */
    .thunder-calc{background:var(--surface);border:1px solid var(--border);
      padding:2rem;max-width:500px;margin:1.5rem 0;}
    .thunder-calc label{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
      color:var(--muted);text-transform:uppercase;display:block;margin-bottom:.75rem;}
    .thunder-calc input[type="range"]{width:100%;-webkit-appearance:none;height:2px;
      background:var(--border);outline:none;margin-bottom:.5rem;}
    .thunder-calc input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
      width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;}
    .thunder-val{font-family:var(--mono);font-size:.7rem;color:var(--gold);
      text-align:right;display:block;margin-bottom:1rem;}
    .thunder-result{display:flex;align-items:center;gap:1rem;margin-top:1rem;}
    .thunder-km{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--white);}
    .risk-badge{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;
      text-transform:uppercase;padding:.3rem .8rem;}
    .risk-red{background:rgba(255,68,68,.15);color:var(--red);border:1px solid var(--red);}
    .risk-yellow{background:rgba(255,200,0,.1);color:#ffc800;border:1px solid #ffc800;}
    .risk-green{background:rgba(68,204,136,.1);color:var(--green);border:1px solid var(--green);}

    /* RISK METER */
    .risk-meter{background:var(--surface);border:1px solid var(--border);
      padding:2rem;max-width:500px;margin:1.5rem 0;}
    .risk-question{display:flex;align-items:center;gap:1rem;padding:.6rem 0;
      border-bottom:1px solid rgba(201,168,76,.08);cursor:pointer;font-size:.95rem;}
    .risk-question:last-of-type{border-bottom:none;}
    .risk-question input[type="checkbox"]{width:1rem;height:1rem;accent-color:var(--gold);cursor:pointer;}
    #risk-result{margin-top:1.5rem;font-family:var(--mono);font-size:.8rem;}

    /* SPECTRUM BAR */
    .spectrum-wrap{width:100%;max-width:600px;margin:1.5rem 0;}
    .spectrum-bar{position:relative;height:40px;
      background:linear-gradient(to right,#4b0082 0%,#0000ff 15%,#00ffff 35%,
        #00ff00 50%,#ffff00 65%,#ff6600 80%,#ff0000 100%);border-radius:2px;}
    .spectrum-line{position:absolute;top:-8px;bottom:-8px;width:2px;cursor:pointer;
      transition:opacity .4s;}
    .spectrum-line::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
      background:white;opacity:.9;box-shadow:0 0 6px white;}
    .spectrum-tooltip{position:absolute;bottom:calc(100% + 12px);left:50%;
      transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);
      padding:.4rem .6rem;font-family:var(--mono);font-size:.6rem;white-space:nowrap;
      pointer-events:none;opacity:0;transition:opacity .2s;}
    .spectrum-line:hover .spectrum-tooltip{opacity:1;}

    /* TIMELINE */
    .timeline{display:flex;flex-direction:column;width:100%;max-width:600px;position:relative;}
    .timeline::before{content:'';position:absolute;left:4.5rem;top:0;bottom:0;
      width:1px;background:var(--border);}
    .timeline-item{display:flex;gap:1.5rem;padding:1rem 0;cursor:pointer;position:relative;}
    .timeline-year{font-family:var(--mono);font-size:.7rem;color:var(--gold);
      width:3.5rem;flex-shrink:0;text-align:right;padding-top:.1rem;}
    .timeline-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);
      flex-shrink:0;margin-top:.3rem;position:relative;z-index:1;}
    .timeline-content{flex:1;}
    .timeline-content h4{font-size:1rem;color:var(--white);margin-bottom:0;}
    .timeline-detail{font-size:.85rem;color:var(--muted);max-height:0;
      overflow:hidden;transition:max-height .3s ease;}
    .timeline-item.open .timeline-detail{max-height:100px;}

    /* DO/DON'T */
    .do-dont{display:grid;grid-template-columns:1fr 1fr;gap:2rem;
      width:100%;max-width:800px;}
    .do-col .col-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--green);margin-bottom:.5rem;}
    .dont-col .col-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--red);margin-bottom:.5rem;}
    .do-item,.dont-item{font-size:.9rem;padding:.5rem .75rem;border-left:2px solid;}
    .do-item{border-color:var(--green);margin-bottom:.4rem;}
    .dont-item{border-color:var(--red);margin-bottom:.4rem;}

    /* CANVAS */
    canvas{display:block;width:100%;height:100%;}

    /* LEAFLET OVERRIDES */
    .leaflet-container{background:#0a0a0f;}
    .leaflet-popup-content-wrapper{background:var(--surface2);border:1px solid var(--border);
      border-radius:0;color:var(--white);}
    .leaflet-popup-tip{background:var(--surface2);}

    /* HERO */
    .hero-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
    .hero-bolt{position:absolute;opacity:0;}
    .hero-bolt:nth-child(1){top:10%;left:65%;animation:flashbolt 4s .5s infinite;}
    .hero-bolt:nth-child(2){top:5%;left:78%;animation:flashbolt 4s 2s infinite;}
    .hero-bolt:nth-child(3){top:18%;left:55%;animation:flashbolt 4s 3.2s infinite;}
    @keyframes flashbolt{
      0%,85%,100%{opacity:0;}
      87%{opacity:1;filter:drop-shadow(0 0 12px var(--blue));}
      89%{opacity:.3;}91%{opacity:1;filter:drop-shadow(0 0 20px var(--blue));}95%{opacity:0;}}
    .hero-content{display:flex;width:100%;height:100%;position:relative;z-index:1;}
    .hero-left{flex:0 0 55%;padding:0 2rem 0 5.5rem;display:flex;
      flex-direction:column;justify-content:center;}
    .hero-right{flex:0 0 45%;padding:4rem 3rem 4rem 2rem;display:flex;
      flex-direction:column;justify-content:center;}
    .hero-title{font-weight:300;font-size:clamp(6rem,14vw,13rem);line-height:.85;
      letter-spacing:-.03em;margin-bottom:1.5rem;}
    .hero-subtitle{font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:300;font-style:italic;
      color:var(--muted);max-width:420px;margin-bottom:2rem;line-height:1.6;}
    .hero-nav-guide{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
      color:var(--muted);line-height:2;margin-bottom:2rem;}
    .hero-cta{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;
      text-transform:uppercase;color:var(--gold);background:none;
      border:1px solid var(--border);padding:.75rem 1.5rem;display:inline-flex;
      align-items:center;gap:.5rem;cursor:pointer;transition:background .2s,border-color .2s;}
    .hero-cta:hover{background:rgba(201,168,76,.08);border-color:var(--gold);}
    .toc{list-style:none;}
    .toc-item{display:flex;align-items:center;gap:1rem;padding:.6rem 0;
      border-bottom:1px solid rgba(201,168,76,.08);cursor:pointer;transition:color .2s;}
    .toc-item:last-child{border-bottom:none;}
    .toc-item:hover .toc-title{color:var(--gold);}
    .toc-num{font-family:var(--mono);font-size:.6rem;color:var(--muted);
      width:1.5rem;flex-shrink:0;}
    .toc-title{font-size:1rem;font-weight:300;color:var(--white);
      letter-spacing:.02em;transition:color .2s;}

    /* SECTION HEADER */
    .section-header{position:absolute;top:2rem;left:5.5rem;z-index:10;pointer-events:none;}
    .section-num{font-family:var(--mono);font-size:.6rem;color:var(--muted);
      letter-spacing:.12em;}

    /* BLITZORTUNG IFRAME */
    .blitz-wrap{width:100%;height:100%;position:relative;}
    .blitz-wrap iframe{width:100%;height:100%;border:none;}

    /* RESPONSIVE */
    @media(max-width:768px){
      .slide-left{padding:3rem 1.5rem 3rem 2rem;flex:0 0 100%;max-width:100%;}
      .slide-right{display:none;}
      .hero-left{padding:0 1.5rem 0 2rem;flex:0 0 100%;}
      .hero-right{display:none;}
      .card-grid{padding:1.5rem;}
      .flip-grid{grid-template-columns:1fr 1fr;padding:1rem 1.5rem;}
      .section-header{left:2rem;}
      .do-dont{grid-template-columns:1fr;gap:1rem;}
    }

    /* REDUCED MOTION */
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;
        transition-duration:.01ms!important;}
      .reveal{opacity:1;transform:none;}
    }
  </style>
</head>
<body>

  <div id="progress-bar" style="width:0%"></div>
  <div id="nav-dots"></div>
  <div id="slide-counter">01 / 01</div>
  <button id="fullscreen-btn">⛶ FS</button>
  <div id="scroll-hint">↓ scorri</div>

  <section class="section" id="hero" data-section="0"><!-- HERO CONTENT --></section>
  <section class="section" id="formazione" data-section="1">
    <div class="section-header"><span class="section-num">01 — FORMAZIONE</span></div>
    <!-- FORMAZIONE CONTENT -->
  </section>
  <section class="section" id="scarica" data-section="2">
    <div class="section-header"><span class="section-num">02 — LA SCARICA</span></div>
    <!-- SCARICA CONTENT -->
  </section>
  <section class="section" id="fisica" data-section="3">
    <div class="section-header"><span class="section-num">03 — FISICA ESTREMA</span></div>
    <!-- FISICA CONTENT -->
  </section>
  <section class="section" id="dati" data-section="4">
    <div class="section-header"><span class="section-num">04 — I NUMERI</span></div>
    <!-- DATI CONTENT -->
  </section>
  <section class="section" id="tipi" data-section="5">
    <div class="section-header"><span class="section-num">05 — TASSONOMIA</span></div>
    <!-- TIPI CONTENT -->
  </section>
  <section class="section" id="franklin" data-section="6">
    <div class="section-header"><span class="section-num">06 — L'ESPERIMENTO</span></div>
    <!-- FRANKLIN CONTENT -->
  </section>
  <section class="section" id="mondo" data-section="7">
    <div class="section-header"><span class="section-num">07 — NEL MONDO</span></div>
    <!-- MONDO CONTENT -->
  </section>
  <section class="section" id="mitologia" data-section="8">
    <div class="section-header"><span class="section-num">08 — MITO E STORIA</span></div>
    <!-- MITOLOGIA CONTENT -->
  </section>
  <section class="section" id="sicurezza" data-section="9">
    <div class="section-header"><span class="section-num">09 — SICUREZZA</span></div>
    <!-- SICUREZZA CONTENT -->
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // === SCROLL ENGINE ===
    const TOTAL_SECTIONS = 10;
    const state = {
      currentSection: 0,
      slideCurrent: new Array(TOTAL_SECTIONS).fill(0),
      slideTotal: [1,4,5,4,3,5,3,4,4,4]
    };

    const sections = Array.from(document.querySelectorAll('.section'));

    function scrollToSection(i) {
      sections[Math.max(0, Math.min(i, TOTAL_SECTIONS - 1))].scrollIntoView({behavior:'smooth'});
    }

    function updateProgress(i) {
      document.getElementById('progress-bar').style.width = ((i+1)/TOTAL_SECTIONS*100)+'%';
    }

    function updateNavDots(i) {
      document.querySelectorAll('.nav-dot').forEach((d,j) => d.classList.toggle('active', j===i));
    }

    function updateSlideCounter(si) {
      const cur = state.slideCurrent[si]+1;
      const tot = state.slideTotal[si];
      document.getElementById('slide-counter').textContent =
        String(cur).padStart(2,'0')+' / '+String(tot).padStart(2,'0');
    }

    // Build nav dots
    (function buildNavDots(){
      const cont = document.getElementById('nav-dots');
      sections.forEach((_,i) => {
        const d = document.createElement('div');
        d.className = 'nav-dot'+(i===0?' active':'');
        d.title = sections[i].id;
        d.addEventListener('click', () => scrollToSection(i));
        cont.appendChild(d);
      });
    })();

    // Section intersection observer
    const sectionObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          const i = parseInt(entry.target.dataset.section);
          state.currentSection = i;
          updateProgress(i);
          updateNavDots(i);
          updateSlideCounter(i);
          // lazy canvas init dispatched via custom event
          entry.target.dispatchEvent(new CustomEvent('section-enter'));
          // trigger reveals in this section
          entry.target.querySelectorAll('.reveal:not(.visible)').forEach(el => el.classList.add('visible'));
        }
      });
    }, {threshold: 0.5});
    sections.forEach(s => sectionObserver.observe(s));

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      switch(e.key) {
        case 'ArrowDown': e.preventDefault(); scrollToSection(state.currentSection+1); break;
        case 'ArrowUp':   e.preventDefault(); scrollToSection(state.currentSection-1); break;
        case 'ArrowRight': e.preventDefault(); carouselNext(state.currentSection); break;
        case 'ArrowLeft':  e.preventDefault(); carouselPrev(state.currentSection); break;
        case 'f': case 'F':
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
          break;
      }
    });
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    // Scroll hint hide
    let scrollHintHidden = false;
    window.addEventListener('scroll', () => {
      if (!scrollHintHidden && window.scrollY > 50) {
        document.getElementById('scroll-hint').classList.add('hidden');
        scrollHintHidden = true;
      }
    }, {passive:true});

    // TOC / data-scroll-to links
    function bindScrollToLinks() {
      document.querySelectorAll('[data-scroll-to]').forEach(el => {
        el.addEventListener('click', () => {
          const target = document.getElementById(el.dataset.scrollTo);
          if (target) target.scrollIntoView({behavior:'smooth'});
        });
      });
    }
    // === SCROLL ENGINE END ===
    // === CAROUSEL ENGINE ===
    // === HERO INIT ===
    // === FORMAZIONE CANVAS ===
    // === SCARICA CANVAS ===
    // === FISICA CANVAS ===
    // === DATI INIT ===
    // === TIPI CANVAS ===
    // === FRANKLIN CANVAS ===
    // === MONDO MAP ===
    // === MITOLOGIA INIT ===
    // === SICUREZZA INIT ===
    // === REVEAL INIT ===
    // === BOOTSTRAP ===
    bindScrollToLinks();
    updateProgress(0);
    // === BOOTSTRAP END ===
  </script>
</body>
</html>
